name: Pylint

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sweepserver/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      NAVER_API_KEY_ID: "NAVER_API_KEY_ID"
      NAVER_API_KEY: "NAVER_API_KEY"
      AWS_ACCESS_KEY: "AWS_ACCESS_KEY"
      AWS_SECRET_KEY: "AWS_SECRET_KEY"
      SMS_API_KEY: "SMS_API_KEY"
      KAKAO_APP_KEY: "KAKAO_APP_KEY"
      NAVER_CONSUMER_KEY: "NAVER_CONSUMER_KEY"
      NAVER_CONSUMER_SECRET: "NAVER_CONSUMER_SECRET"
    strategy:
      matrix:
        python-version: ["3.13.2"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        cd sweepserver
        pipenv install --dev

    - name: Analysing the code with pylint
      run: |
        cd sweepserver
        pipenv run sh -c 'DJANGO_SETTINGS_MODULE=sweepserver.settings.local pylint --load-plugins pylint_django --rcfile=.pylintrc .'

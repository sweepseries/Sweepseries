name: Coverage and Code Quality

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      NAVER_API_KEY_ID: "NAVER_API_KEY_ID"
      NAVER_API_KEY: "NAVER_API_KEY"
      AWS_ACCESS_KEY: "AWS_ACCESS_KEY"
      AWS_SECRET_KEY: "AWS_SECRET_KEY"
      SMS_API_KEY: "SMS_API_KEY"
      KAKAO_APP_KEY: "KAKAO_APP_KEY"
      NAVER_CONSUMER_KEY: "NAVER_CONSUMER_KEY"
      NAVER_CONSUMER_SECRET: "NAVER_CONSUMER_SECRET"
    strategy:
      matrix:
        python-version: ["3.13.2"]
        node-version: [22]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: catchb/yarn.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y lcov
          pip install pipenv
          cd sweepserver
          pipenv install --dev
          cd ../catchb
          yarn install --dev
          cd ..

      - name: Backend Coverage
        run: |
          cd sweepserver
          pipenv run coverage run manage.py test
          pipenv run coverage lcov
          pipenv run coverage xml
          sed -i "s|<source></source>|<source>sweepseries</source>|g" coverage.xml
          cd ..

      - name: Catch B Mobile App Coverage
        run: |
          cd catchb
          yarn global add lcov-result-merger
          yarn test --coverage --watchAll=false
          cp coverage/lcov.info coverage.lcov
          cd ..
          lcov-result-merger '*/coverage.lcov' coverage.lcov --prepend-source-files --prepend-path-fix "."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage.lcov

name: Coverage and Code Quality

on:
  pull_request:
    branches:
      - main

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      lcov-path: ${{ steps.install-lcov.outputs.lcov-path }}
    steps:
      - name: Install lcov
        id: install-lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          echo "::set-output name=lcov-path::$(which lcov)"

  server-test:
    runs-on: ubuntu-latest
    needs: prep
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      NAVER_API_KEY_ID: "NAVER_API_KEY_ID"
      NAVER_API_KEY: "NAVER_API_KEY"
      AWS_ACCESS_KEY: "AWS_ACCESS_KEY"
      AWS_SECRET_KEY: "AWS_SECRET_KEY"
      SMS_API_KEY: "SMS_API_KEY"
      KAKAO_APP_KEY: "KAKAO_APP_KEY"
      NAVER_CONSUMER_KEY: "NAVER_CONSUMER_KEY"
      NAVER_CONSUMER_SECRET: "NAVER_CONSUMER_SECRET"
    strategy:
      matrix:
        python-version: ["3.13.2"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pipenv'

      - name: Install dependencies
        run: |
          pip install pipenv
          cd sweepserver
          pipenv install --dev

      - name: Server Coverage
        run: |
          cd sweepserver
          pipenv run coverage run manage.py test
          pipenv run coverage lcov
          pipenv run coverage xml
          sed -i "s|<source></source>|<source>sweepserver</source>|g" coverage.xml

      - name: Upload Server coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: server-coverage
          path: sweepserver/coverage.lcov

  node-tests:
    runs-on: ubuntu-latest
    needs: prep
    strategy:
      matrix:
        project-dir: [catchb, catchb-admin]
        node-version: [22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: ${{ matrix.project-dir }}/yarn.lock

      - name: Install dependencies
        run: |
          cd ${{ matrix.project-dir }}
          yarn install --dev

      - name: Run tests
        run: |
          cd ${{ matrix.project-dir }}
          yarn test --watchAll=false --coverage
          cp coverage/lcov.info coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.project-dir }}-coverage
          path: ${{ matrix.project-dir }}/coverage.lcov

  quality:
    runs-on: ubuntu-latest
    needs: [server-test, node-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      
      - name: Download All Coverages
        uses: actions/download-artifact@v3
        with:
          path: .

      - name: Merge Coverages
        run: |
          lcov-result-merger -o coverage.lcov \
            ./sweepserver/coverage.lcov \
            ./catchb/coverage.lcov \
            ./catchb-admin/coverage.lcov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage.lcov
